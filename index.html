<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Rivals Roulette</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Animación de parpadeo para el efecto de carga */
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .anim-ticking { animation: pulse-fast 0.1s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center font-sans">

    <main class="text-center max-w-md w-full px-4">
        <h1 class="text-4xl font-extrabold tracking-wider uppercase mb-2 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-400">
            Rival Roulette
        </h1>
        <p class="text-slate-400 mb-6 text-sm">¿No sabes a quién pickear? Deja que el destino decida.</p>

        <!-- Filtros por Rol -->
        <div class="flex justify-center gap-2 mb-6">
            <button data-role="all" class="role-btn px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider bg-slate-800 text-white border border-slate-700 cursor-pointer transition-all active:scale-95">
                Todos
            </button>
            <button data-role="Vanguard" class="role-btn px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider bg-slate-950 text-slate-400 border border-slate-800 hover:border-blue-500/50 cursor-pointer transition-all active:scale-95">
                Vanguard
            </button>
            <button data-role="Duelist" class="role-btn px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider bg-slate-950 text-slate-400 border border-slate-800 hover:border-red-500/50 cursor-pointer transition-all active:scale-95">
                Duelist
            </button>
            <button data-role="Strategist" class="role-btn px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider bg-slate-950 text-slate-400 border border-slate-800 hover:border-emerald-500/50 cursor-pointer transition-all active:scale-95">
                Strategist
            </button>
        </div>

        <!-- Contenedor del Héroe -->
        <div id="card-container" class="bg-slate-900 border-4 border-slate-700 rounded-2xl p-6 shadow-2xl transition-all duration-300 transform mb-8">
            <div class="h-64 flex items-center justify-center overflow-hidden rounded-lg bg-slate-950/50 mb-4 relative">
                <img id="hero-img" src="https://placehold.co/300x300/1e293b/ffffff?text=?" alt="Selecciona Héroe" class="max-h-full object-contain transition-all duration-150">
            </div>
            
            <h2 id="hero-name" class="text-2xl font-bold tracking-wide">¿Quién saldrá?</h2>
            <p id="hero-role" class="text-sm font-semibold tracking-widest uppercase text-slate-500 mt-1">-</p>
        </div>

        <!-- Botón de Acción -->
        <button id="spin-btn" class="w-full bg-gradient-to-r from-red-600 to-amber-500 hover:from-red-500 hover:to-amber-400 text-slate-950 font-black text-xl py-4 px-8 rounded-xl uppercase tracking-widest shadow-lg shadow-red-900/30 active:scale-98 transition-all cursor-pointer">
            Girar Ruleta
        </button>
    </main>

    <script src="app.js"></script>
</body>
</html>
